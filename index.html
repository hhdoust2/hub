<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پیوندهای من</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1b1430">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="پیوندها">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#271c3f;
    --bg-bottom:#130d20;
    --surface:#2a2140;
    --surface-2:#231a38;
    --border:rgba(255,255,255,.09);
    --text:#f3eefb;
    --text-dim:#b3a8cf;
    --accent:#8ea7ff;
    --accent-ink:#1a2340;
    --danger:#ff6b6b;
    --radius-chrome:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  [hidden]{display:none !important;}
  body{
    min-height:100vh;
    font-family:"Vazirmatn","Tahoma",sans-serif;
    color:var(--text);
    background:
      radial-gradient(560px 420px at 85% -5%, rgba(142,167,255,.16), transparent 60%),
      radial-gradient(520px 420px at -5% 100%, rgba(255,77,109,.14), transparent 60%),
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment:fixed;
  }
  button{font-family:inherit;}
  .page{max-width:1400px;margin:0 auto;padding:22px 20px 60px;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 26px;
  }
  .brand{
    font-size:clamp(1.3rem,2.4vw,1.7rem);
    font-weight:700;
    margin:0;
    letter-spacing:.2px;
  }
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:14px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text-dim);
    cursor:pointer;
    transition:transform .15s ease, color .15s ease, background .15s ease;
  }
  .icon-btn:hover{color:var(--text);background:var(--surface-2);}
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:focus-visible, .jelly-card:focus-visible, .btn-primary:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }
  .icon-btn.small{width:34px;height:34px;border-radius:10px;flex:none;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;}
  .icon-btn:disabled:hover{background:var(--surface);color:var(--text-dim);}

  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .install-btn{
    display:inline-flex;align-items:center;gap:6px;
    height:42px;padding:0 15px;border-radius:14px;
    background:var(--accent);color:var(--accent-ink);
    border:none;font-weight:700;font-size:.84rem;
    cursor:pointer;transition:filter .15s ease, transform .15s ease;
  }
  .install-btn:hover{filter:brightness(1.07);}
  .install-btn:active{transform:scale(.96);}

  /* ---- grid & jelly cards ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
  }
  @media (min-width:640px){
    .grid{grid-template-columns:repeat(4,1fr);gap:16px;}
  }
  @media (min-width:960px){
    .grid{grid-template-columns:repeat(6,1fr);gap:20px;}
    .jelly-card{aspect-ratio:4/3;}
  }
  @media (min-width:1400px){
    .grid{grid-template-columns:repeat(8,1fr);}
  }

  .jelly-card{
    --c-base:#ff4d6d;--c-light:#ff8fa3;
    position:relative;
    width:100%;
    aspect-ratio:1/1.05;
    border:none;
    cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;
    padding:10px;
    color:#fff9f0;
    background:linear-gradient(155deg, var(--c-light) 0%, var(--c-base) 62%);
    border-radius:42% 38% 40% 44% / 46% 42% 46% 40%;
    box-shadow:
      0 10px 22px -8px color-mix(in srgb, var(--c-base) 65%, transparent),
      inset 0 -6px 10px -4px rgba(0,0,0,.18);
    transform:rotate(var(--tilt,0deg));
    transition:transform .32s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
  }
  .jelly-card:nth-child(6n+1){--tilt:-2deg;}
  .jelly-card:nth-child(6n+2){--tilt:1.5deg;}
  .jelly-card:nth-child(6n+3){--tilt:-1deg;}
  .jelly-card:nth-child(6n+4){--tilt:2deg;}
  .jelly-card:nth-child(6n+5){--tilt:-1.5deg;}
  .jelly-card:nth-child(6n+6){--tilt:1deg;}
  .jelly-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(ellipse 60% 40% at 28% 20%, rgba(255,255,255,.55), transparent 70%);
    pointer-events:none;
  }
  .jelly-card:hover{
    transform:rotate(0deg) scale(1.05) translateY(-2px);
    box-shadow:
      0 16px 28px -10px color-mix(in srgb, var(--c-base) 70%, transparent),
      inset 0 -6px 10px -4px rgba(0,0,0,.18);
  }
  .jelly-card:active{
    transform:rotate(0deg) scale(1.08,.9);
  }
  .jelly-label{
    font-size:clamp(.86rem,2.2vw,1.15rem);
    font-weight:700;
    text-align:center;
    max-width:92%;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    text-shadow:0 1px 4px rgba(0,0,0,.2);
  }

  .jelly-card.enter{
    animation:pop .5s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay:var(--delay,0ms);
  }
  @keyframes pop{
    from{opacity:0;transform:scale(.6) rotate(var(--tilt,0deg));}
    to{opacity:1;transform:scale(1) rotate(var(--tilt,0deg));}
  }
  @media (prefers-reduced-motion:reduce){
    .jelly-card, .jelly-card.enter{animation:none !important;transition:none !important;}
  }

  /* ---- empty state ---- */
  .empty-state{
    text-align:center;padding:70px 20px;color:var(--text-dim);
  }
  .empty-state p{margin:0 0 18px;font-size:1rem;}

  .btn-primary{
    background:var(--accent);color:var(--accent-ink);
    border:none;border-radius:12px;
    padding:11px 22px;font-weight:700;font-size:.94rem;
    cursor:pointer;transition:filter .15s ease, transform .15s ease;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:active{transform:scale(.97);}

  /* ---- settings modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,7,18,.6);
    backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:20;
  }
  .modal{
    width:100%;max-width:460px;max-height:86vh;
    display:flex;flex-direction:column;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-chrome);
    padding:20px 20px 12px;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;
  }
  .modal-head h2{font-size:1.06rem;margin:0;font-weight:700;}

  .add-form{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:.8rem;color:var(--text-dim);}
  .field input{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:11px;
    padding:10px 12px;
    font-size:.92rem;
    font-family:inherit;
  }
  .field input::placeholder{color:#786e93;}
  .field-error{color:var(--danger);font-size:.8rem;margin:0;}
  .add-form .btn-primary{align-self:flex-start;margin-top:2px;}

  .backup-row{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:12px 0;margin-top:2px;
    border-top:1px solid var(--border);
  }
  .btn-secondary{
    background:transparent;color:var(--text);
    border:1px solid var(--border);border-radius:11px;
    padding:9px 14px;font-weight:600;font-size:.84rem;
    cursor:pointer;transition:background .15s ease, transform .15s ease;
  }
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-secondary:active{transform:scale(.97);}
  .restore-confirm{
    display:flex;align-items:center;flex-wrap:wrap;gap:8px;
    font-size:.85rem;color:var(--text-dim);width:100%;
  }
  .restore-confirm .btn-primary, .restore-confirm .btn-secondary{padding:7px 14px;font-size:.82rem;}
  .backup-error{color:var(--danger);font-size:.8rem;width:100%;margin:0;}

  .link-list{
    list-style:none;margin:14px 0 4px;padding:0;
    overflow-y:auto;
    border-top:1px solid var(--border);
    padding-top:8px;
  }
  .link-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 2px;
    border-bottom:1px solid var(--border);
  }
  .link-row:last-child{border-bottom:none;}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .row-title{
    flex:1;font-size:.9rem;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .confirm-text{color:var(--danger);font-size:.85rem;}
  .row-edit{flex:1;display:flex;flex-direction:column;gap:6px;}
  .row-edit input{
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:8px;padding:6px 9px;font-size:.84rem;font-family:inherit;
  }
  .list-empty{color:var(--text-dim);font-size:.86rem;padding:14px 2px;text-align:center;}

  .status{color:var(--text-dim);font-size:.9rem;padding:30px 4px;text-align:center;}
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <h1 class="brand">پیوندهای من</h1>
    <div class="topbar-actions">
      <button class="install-btn" id="installBtn" hidden>
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 19h16"/>
        </svg>
        نصب برنامه
      </button>
      <button class="icon-btn" id="openSettings" aria-label="تنظیمات">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="7.5"/>
          <line x1="12" y1="2" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22" y2="12"/>
          <line x1="4.9" y1="4.9" x2="6.4" y2="6.4"/><line x1="17.6" y1="17.6" x2="19.1" y2="19.1"/>
          <line x1="19.1" y1="4.9" x2="17.6" y2="6.4"/><line x1="6.4" y1="17.6" x2="4.9" y2="19.1"/>
        </svg>
      </button>
    </div>
  </header>

  <p class="status" id="statusMsg">در حال بارگذاری…</p>
  <main class="grid" id="grid" hidden></main>
  <div class="empty-state" id="emptyState" hidden>
    <p>هنوز پیوندی اضافه نکرده‌اید</p>
    <button class="btn-primary" id="emptyAddBtn">افزودن پیوند</button>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle">تنظیمات پیوندها</h2>
      <button class="icon-btn small" id="closeSettings" aria-label="بستن">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
      </button>
    </div>

    <form class="add-form" id="addForm">
      <div class="field">
        <label for="titleInput">عنوان</label>
        <input id="titleInput" type="text" placeholder="مثلاً یوتیوب" autocomplete="off">
      </div>
      <div class="field">
        <label for="urlInput">آدرس</label>
        <input id="urlInput" type="text" placeholder="example.com" autocomplete="off">
      </div>
      <p class="field-error" id="formError" hidden></p>
      <button type="submit" class="btn-primary">افزودن</button>
    </form>

    <div class="backup-row" id="backupSection"></div>
    <input type="file" id="restoreInput" accept="application/json" hidden>

    <ul class="link-list" id="linkList"></ul>
  </div>
</div>

<script>
const ICON_PENCIL = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><line x1="14" y1="6" x2="17" y2="9"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>';
const ICON_UP = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

const STORAGE_KEY = 'jelly-links-v1';
const PALETTE = [
  {base:'#ff4d6d', light:'#ff8fa3'},
  {base:'#ff9f1c', light:'#ffc46b'},
  {base:'#7bb825', light:'#b7de6b'},
  {base:'#3a86ff', light:'#7db0ff'},
  {base:'#8338ec', light:'#b37cf5'},
  {base:'#05a889', light:'#4fe0b5'},
];

let links = [];
let loaded = false;
let editingId = null;
let confirmDeleteId = null;
let pendingRestore = null;
let backupError = '';

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function normalizeUrl(raw){
  let u = raw.trim();
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}
function isValidUrl(u){
  try{ new URL(u); return true; }catch(e){ return false; }
}

function loadLinks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    links = raw ? JSON.parse(raw) : [];
  }catch(e){
    links = [];
  }
  loaded = true;
  renderAll(true);
}
function saveLinks(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
  }catch(e){
    console.error('ذخیره‌سازی ناموفق بود', e);
  }
}

function addLink(title, url){
  const color = links.length % PALETTE.length;
  links.push({id:'l'+Date.now()+Math.random().toString(36).slice(2,7), title, url, color});
  saveLinks();
  renderAll(false);
}
function updateLink(id, title, url){
  const item = links.find(l=>l.id===id);
  if(item){ item.title=title; item.url=url; saveLinks(); }
  editingId = null;
  renderAll(false);
}
function deleteLink(id){
  links = links.filter(l=>l.id!==id);
  confirmDeleteId = null;
  saveLinks();
  renderAll(false);
}
function moveLink(id, direction){
  const idx = links.findIndex(l=>l.id===id);
  const newIdx = idx + direction;
  if(idx === -1 || newIdx < 0 || newIdx >= links.length) return;
  const tmp = links[idx];
  links[idx] = links[newIdx];
  links[newIdx] = tmp;
  saveLinks();
  renderAll(false);
}

function renderAll(isInitial){
  renderGrid(isInitial);
  renderSettingsList();
  renderBackupSection();
}

function renderGrid(isInitial){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  const status = document.getElementById('statusMsg');
  status.hidden = true;
  grid.innerHTML = '';

  if(links.length === 0){
    grid.hidden = true;
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  grid.hidden = false;

  links.forEach((link, i)=>{
    const c = PALETTE[link.color % PALETTE.length];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'jelly-card' + (isInitial ? ' enter' : '');
    btn.style.setProperty('--c-base', c.base);
    btn.style.setProperty('--c-light', c.light);
    if(isInitial) btn.style.setProperty('--delay', (i*40)+'ms');
    btn.setAttribute('aria-label', 'باز کردن ' + link.title);

    const label = document.createElement('span');
    label.className = 'jelly-label';
    label.textContent = link.title;

    btn.appendChild(label);
    btn.addEventListener('click', ()=> window.open(link.url, '_blank', 'noopener'));
    grid.appendChild(btn);
  });
}

function renderSettingsList(){
  const list = document.getElementById('linkList');
  list.innerHTML = '';

  if(links.length === 0){
    const li = document.createElement('li');
    li.className = 'list-empty';
    li.textContent = 'هنوز پیوندی وجود ندارد.';
    list.appendChild(li);
    return;
  }

  links.forEach((link, idx)=>{
    const c = PALETTE[link.color % PALETTE.length];
    const li = document.createElement('li');
    li.className = 'link-row';

    if(editingId === link.id){
      li.innerHTML =
        '<span class="dot" style="background:'+c.base+'"></span>'+
        '<div class="row-edit">'+
          '<input type="text" class="edit-title" value="'+escapeHtml(link.title)+'">'+
          '<input type="text" class="edit-url" value="'+escapeHtml(link.url)+'">'+
        '</div>'+
        '<button class="icon-btn small confirm-save" aria-label="ذخیره">'+ICON_CHECK+'</button>'+
        '<button class="icon-btn small cancel-edit" aria-label="انصراف">'+ICON_X+'</button>';

      li.querySelector('.confirm-save').addEventListener('click', ()=>{
        const t = li.querySelector('.edit-title').value.trim();
        let u = li.querySelector('.edit-url').value.trim();
        if(!t || !u) return;
        u = normalizeUrl(u);
        if(!isValidUrl(u)) return;
        updateLink(link.id, t, u);
      });
      li.querySelector('.cancel-edit').addEventListener('click', ()=>{
        editingId = null; renderSettingsList();
      });

    } else if(confirmDeleteId === link.id){
      li.innerHTML =
        '<span class="dot" style="background:'+c.base+'"></span>'+
        '<span class="row-title confirm-text">حذف شود؟</span>'+
        '<button class="icon-btn small danger confirm-del" aria-label="بله، حذف کن">بله</button>'+
        '<button class="icon-btn small cancel-del" aria-label="انصراف">خیر</button>';

      li.querySelector('.confirm-del').addEventListener('click', ()=> deleteLink(link.id));
      li.querySelector('.cancel-del').addEventListener('click', ()=>{
        confirmDeleteId = null; renderSettingsList();
      });

    } else {
      li.innerHTML =
        '<span class="dot" style="background:'+c.base+'"></span>'+
        '<span class="row-title">'+escapeHtml(link.title)+'</span>'+
        '<button class="icon-btn small up-btn" aria-label="جابجایی به بالا"'+(idx===0?' disabled':'')+'>'+ICON_UP+'</button>'+
        '<button class="icon-btn small down-btn" aria-label="جابجایی به پایین"'+(idx===links.length-1?' disabled':'')+'>'+ICON_DOWN+'</button>'+
        '<button class="icon-btn small edit-btn" aria-label="ویرایش">'+ICON_PENCIL+'</button>'+
        '<button class="icon-btn small del-btn" aria-label="حذف">'+ICON_TRASH+'</button>';

      li.querySelector('.up-btn').addEventListener('click', ()=> moveLink(link.id, -1));
      li.querySelector('.down-btn').addEventListener('click', ()=> moveLink(link.id, 1));
      li.querySelector('.edit-btn').addEventListener('click', ()=>{
        editingId = link.id; confirmDeleteId = null; renderSettingsList();
      });
      li.querySelector('.del-btn').addEventListener('click', ()=>{
        confirmDeleteId = link.id; editingId = null; renderSettingsList();
      });
    }
    list.appendChild(li);
  });
}

function renderBackupSection(){
  const box = document.getElementById('backupSection');
  if(!box) return;

  if(pendingRestore){
    box.innerHTML =
      '<span class="restore-confirm">'+
        '<span>'+pendingRestore.length+' پیوند از فایل پشتیبان جایگزین لیست فعلی شود؟</span>'+
        '<button type="button" class="btn-primary" id="confirmRestoreBtn">بله، جایگزین شود</button>'+
        '<button type="button" class="btn-secondary" id="cancelRestoreBtn">انصراف</button>'+
      '</span>';
    document.getElementById('confirmRestoreBtn').addEventListener('click', applyRestore);
    document.getElementById('cancelRestoreBtn').addEventListener('click', ()=>{
      pendingRestore = null; renderBackupSection();
    });
    return;
  }

  box.innerHTML =
    '<button type="button" class="btn-secondary" id="backupBtn">پشتیبان‌گیری</button>'+
    '<button type="button" class="btn-secondary" id="restoreBtn">بازیابی از فایل</button>'+
    (backupError ? '<p class="backup-error">'+escapeHtml(backupError)+'</p>' : '');

  document.getElementById('backupBtn').addEventListener('click', downloadBackup);
  document.getElementById('restoreBtn').addEventListener('click', ()=>{
    document.getElementById('restoreInput').click();
  });
}

function downloadBackup(){
  const data = links.map(l=>({title:l.title, url:l.url}));
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'links-backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

document.getElementById('restoreInput').addEventListener('change', function(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  backupError = '';
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('invalid');
      const cleaned = data
        .filter(d => d && typeof d.title === 'string' && typeof d.url === 'string' && d.title.trim() && d.url.trim())
        .map(d => ({title: d.title.trim(), url: normalizeUrl(d.url.trim())}))
        .filter(d => isValidUrl(d.url));
      if(cleaned.length === 0){
        backupError = 'فایل معتبر نیست یا پیوندی در آن نبود.';
        renderBackupSection();
        return;
      }
      pendingRestore = cleaned;
      renderBackupSection();
    }catch(err){
      backupError = 'فایل معتبر نیست.';
      renderBackupSection();
    }
  };
  reader.readAsText(file);
});

function applyRestore(){
  links = pendingRestore.map((d, i) => ({
    id: 'l'+Date.now()+Math.random().toString(36).slice(2,7)+i,
    title: d.title,
    url: d.url,
    color: i % PALETTE.length
  }));
  pendingRestore = null;
  saveLinks();
  renderAll(true);
}

function showFormError(msg){
  const err = document.getElementById('formError');
  err.textContent = msg;
  err.hidden = false;
}

document.getElementById('addForm').addEventListener('submit', function(e){
  e.preventDefault();
  const titleInput = document.getElementById('titleInput');
  const urlInput = document.getElementById('urlInput');
  const err = document.getElementById('formError');
  err.hidden = true;

  const title = titleInput.value.trim();
  let url = urlInput.value.trim();
  if(!title || !url){ showFormError('عنوان و آدرس را وارد کنید'); return; }
  url = normalizeUrl(url);
  if(!isValidUrl(url)){ showFormError('آدرس معتبر نیست'); return; }

  addLink(title, url);
  titleInput.value = '';
  urlInput.value = '';
  titleInput.focus();
});

function openSettings(){
  editingId = null; confirmDeleteId = null; pendingRestore = null; backupError = '';
  renderSettingsList();
  renderBackupSection();
  document.getElementById('overlay').hidden = false;
  document.getElementById('titleInput').focus();
}
function closeSettings(){
  document.getElementById('overlay').hidden = true;
}
document.getElementById('openSettings').addEventListener('click', openSettings);
document.getElementById('emptyAddBtn').addEventListener('click', openSettings);
document.getElementById('closeSettings').addEventListener('click', closeSettings);
document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target.id === 'overlay') closeSettings();
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && !document.getElementById('overlay').hidden) closeSettings();
});

loadLinks();

// ---- نصب PWA ----
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBtn').hidden = false;
});
document.getElementById('installBtn').addEventListener('click', async function(){
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBtn').hidden = true;
});
window.addEventListener('appinstalled', function(){
  document.getElementById('installBtn').hidden = true;
  deferredPrompt = null;
});

// ---- ثبت سرویس‌ورکر ----
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

</script>
